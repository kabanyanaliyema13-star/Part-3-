<body>
<header>
  <div class="brand">
    <img src="images/cake-king-bakery-logo.jpg" class="header-logo" alt="Cake King Bakery logo">
    <span class="brand-name"><span class="crown">&#128081;</span> Cake King Bakery</span>
  </div>
  <nav class="nav-link">
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="about.html">About us</a></li>

      <li><a href="contact.html">Contact us</a></li>
      <li><a href="enquiry.html">Enquiry</a></li>
    </ul>
  </nav>
</header>
<main>
  <img src="images/cake-king-bakery-logo.jpg" class="enquiry-logo" alt="CakeKingBakery logo">

  <h1 class="enquiry-title"><i><u>Cake Enquiry</u></i></h1>
  <p class="enquiry-intro"><u>Please complete the form below to enquire about ordering a cake from Cake King Bakery.</u></p>

  <form class="enquiry-form" id="enquiryForm" action="https://formsubmit.co/ajax/CakeKingBakery@gmail.com" method="post" novalidate>
    <div>
      <label for="fullName">Full Name:</label>
      <input type="text" id="fullName" name="fullName" placeholder="Sibusiso Dlamini" required>
    </div>
    <div>
      <label for="enqEmail">Email:</label>
      <input type="email" id="enqEmail" name="email" placeholder="SibusisoDlamini@gmail.com" required>
    </div>
    <div>
      <label for="phone">PhoneNumber:</label>
      <input type="tel" id="phone" name="phone" placeholder="063-638-9414" required>
    </div>
    <div>
      <label for="cakeType">Cake Types:</label>
      <input type="text" id="cakeType" name="cakeType" placeholder="Wedding Cake" required>
    </div>
    <div>
      <label for="cakeFlavour">Cake flavours:</label>
      <input type="text" id="cakeFlavour" name="cakeFlavour" placeholder="Vanilla" required>
    </div>
    <div>
      <label for="cakeSize">Cake Size:</label>
      <select id="cakeSize" name="cakeSize">
        <option>Small</option>
        <option>Medium</option>
        <option>Large</option>
      </select>
    </div>
    <div>
      <label for="occasion">Occasions:</label>
      <select id="occasion" name="occasion">
        <option>Wedding</option>
        <option>Baby shower</option>
        <option>Birthday</option>
        <option>Graduations</option>
        <option>Anniversaries</option>
        <option>Other</option>
      </select>
    </div>
    <div>
      <label for="prefDate">Preferred DATE:</label>
      <input type="date" id="prefDate" name="prefDate" required>
    </div>
    <div>
      <label for="people">Number Of People:</label>
      <input type="number" id="people" name="people" min="1" required>
    </div>
    <div>
      <label for="description">Description:</label>
      <textarea id="description" name="description"></textarea>
    </div>
    <div>
      <label for="specialRequest">Special Request</label>
      <textarea id="specialRequest" name="specialRequest"></textarea>
    </div>
    <input type="submit" value="Submit">
  </form>
</main>
<footer>&copy;ST1053047#DISD1_Cake_King_Bakery</footer>
